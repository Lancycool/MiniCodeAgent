[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicodeagent"
version = "0.1.0"
description = "A lightweight, hand-written code agent runtime with evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "radon>=6.0",
    "ruff>=0.6",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mca = "mca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
